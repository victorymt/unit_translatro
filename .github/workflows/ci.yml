name: CI

on:
  push:
    branches: [main, refactor/**]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: python -m pip install --editable .

      - name: Run unit and adapter tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          converter_core.py converter_io.py batch_processing.py
          app_config.py pricing_catalog.py web_api.py unit_converter.py
          unit_translator tests

      - name: Run batch CLI smoke test
        shell: bash
        run: |
          request_file="${RUNNER_TEMP}/requests.jsonl"
          result_file="${RUNNER_TEMP}/result.json"
          printf '%s\n' '{"mode":"multiplier","value":"0.05"}' > "${request_file}"
          python unit_converter.py --input-file "${request_file}" --format json > "${result_file}"
          RESULT_FILE="${result_file}" python -c 'import json, os; payload = json.load(open(os.environ["RESULT_FILE"])); assert payload[0]["mode"] == "multiplier"; assert payload[0]["multiplier"] == "0.05"'

      - name: Build wheel
        run: >-
          python -m pip wheel . --no-deps --no-build-isolation
          --wheel-dir "${RUNNER_TEMP}/wheels"

      - name: Install wheel and verify packaged assets
        shell: bash
        run: |
          venv_root="${RUNNER_TEMP}/wheel-venv"
          python -m venv "${venv_root}"
          "${venv_root}/bin/python" -m pip install --no-deps "${RUNNER_TEMP}/wheels"/*.whl
          "${venv_root}/bin/python" - <<'PY'
          import threading
          from urllib.request import urlopen

          from pricing_catalog import load_pricing_catalog
          from web_api import create_server

          catalog = load_pricing_catalog()
          assert catalog.version == "pricing-2026-08-21"
          assert len(catalog.profiles) == 4
          server = create_server("127.0.0.1", 0)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              base_url = f"http://127.0.0.1:{server.server_address[1]}"
              with urlopen(base_url + "/") as response:
                  assert "Token 成本换算" in response.read().decode()
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=2)
          PY

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
