[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-translator"
version = "1.0.0"
description = "ChatGPT relay multiplier and token cost converter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "unit-translator contributors"}]
dependencies = [
  "platformdirs>=4",
  "tomli-w>=1.1",
]

[project.scripts]
unit-translator = "unit_translator.commands.main:main"
unit-translator-web = "unit_translator.adapters.web:run_server"
unit-translator-catalog = "unit_translator.commands.catalog:main"

[tool.setuptools.packages.find]
include = ["unit_translator*"]

[tool.setuptools.package-data]
unit_translator = [
  "resources/*.json",
  "resources/web/*.html",
  "resources/web/assets/*.js",
  "resources/web/assets/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
