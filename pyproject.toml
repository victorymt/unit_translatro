[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unit-translator"
version = "1.0.0"
description = "ChatGPT relay multiplier and token cost converter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "unit-translator contributors"}]
dependencies = [
  "platformdirs>=4",
  "textual>=1",
  "tomli-w>=1.1",
]

[project.scripts]
unit-translator = "unit_converter:main"
unit-translator-web = "web_api:run_server"
unit-translator-catalog = "catalog_tool:main"

[tool.setuptools]
py-modules = [
  "unit_converter",
  "converter_core",
  "converter_io",
  "batch_processing",
  "catalog_tool",
  "app_config",
  "web_api",
  "pricing_catalog",
  "settings_store",
  "tui_app",
]

[tool.setuptools.packages.find]
include = ["unit_translator*"]

[tool.setuptools.data-files]
"config" = ["config/default_profiles.json"]
"web" = ["web/index.html"]
"web/assets" = ["web/assets/app.js", "web/assets/styles.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
